<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Montera - Money tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --card:#0B0B0C; --raise:#111113; --raise2:#18181B;
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --txt:#F5F5F6; --mut:#8E8E96; --faint:#5A5A62;
  --ac:#FFFFFF; --want:#E8C27A; --pos:#6EDBAA; --neg:#F0847F;
  --spring:cubic-bezier(0.22,1,0.36,1);
}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
html,body{height:100%;margin:0;background:#000;color:var(--txt);
  font-family:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select{font-family:inherit}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
.stage{min-height:100dvh;display:grid;place-items:center;padding:24px}
.phone{position:relative;width:390px;height:min(844px,calc(100dvh - 48px));background:var(--bg);border-radius:44px;overflow:hidden;
  border:1px solid var(--line2);box-shadow:0 0 0 8px #070708,0 40px 120px -20px rgba(0,0,0,.95)}
@media (max-width:480px){
  .stage{padding:0;display:block}
  .phone{width:100vw;height:100dvh;border-radius:0;border:0;box-shadow:none}
}
.row2{display:flex;gap:8px}
.col{display:flex;flex-direction:column;gap:8px}

/* screens */
.screen{position:absolute;inset:0;visibility:hidden;opacity:0;transform:translateY(10px);
  transition:opacity .3s var(--spring),transform .5s var(--spring),visibility 0s .5s}
.screen.active{visibility:visible;opacity:1;transform:none;transition-delay:0s}
.scroll{height:100%;overflow-y:auto;overscroll-behavior:contain;padding:calc(env(safe-area-inset-top) + 14px) 18px 130px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.page-title{font-size:26px;font-weight:600;letter-spacing:-.03em;margin:8px 2px 16px}

/* primitives */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.press{transition:transform .35s var(--spring),background-color .2s,border-color .2s}
.press:active{transform:scale(.97);transition-duration:.1s}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#CFCFD6;background:#0E0E10;border:1px solid var(--line);transition:transform .3s var(--spring),background-color .2s;flex:none}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.sm{width:30px;height:30px;border-radius:10px}
.icon-btn.sm svg{width:15px;height:15px}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 10px}
.sec-head h2{font-size:17px;font-weight:600;letter-spacing:-.02em;margin:0}
.link{font-size:13.5px;color:#D4D4DA;font-weight:500}
.mut{color:var(--mut)}
.amt{transition:filter .3s}
body.private .amt{filter:blur(7px)}

/* 3D emoji */
.em3d{display:inline-grid;place-items:center;width:var(--s,32px);height:var(--s,32px);line-height:1;flex:none;font-size:calc(var(--s,32px)*.78)}
.em3d img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,.55))}
.em3d .emo{display:none}
.em3d[data-fb] .emo,.em3d.only .emo{display:inline}
.avatar{border-radius:50%;background:#101012;border:1px solid var(--line2);display:grid;place-items:center;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;height:44px}
.brand{display:flex;align-items:center}
.top-r{display:flex;gap:8px;align-items:center}

/* hero */
.hero{padding:16px 2px 4px}
.greet{font-size:14px;color:var(--mut);margin-bottom:14px}
.hero-label{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:14px;font-weight:500}
.hero-num{font-size:62px;font-weight:500;letter-spacing:-.045em;margin-top:8px}
.safe-row{margin-top:18px;padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.safe-title{font-size:14.5px;font-weight:500}
.safe-sub{font-size:12.5px;color:var(--mut);margin-top:2px}
.switch{width:46px;height:28px;border-radius:99px;background:#26262B;position:relative;flex:none;transition:background-color .3s var(--spring)}
.switch span{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.5);transition:transform .45s var(--spring),background-color .3s}
.switch[aria-checked="true"]{background:#fff}
.switch[aria-checked="true"] span{transform:translateX(18px);background:#000}

/* odometer */
.odo{display:inline-flex;align-items:flex-start;height:1.1em;line-height:1.1;overflow:visible}
.odo-s{display:block;height:1.1em}
.odo-sym{font-size:.5em;font-weight:400;color:var(--mut);margin:.2em .1em 0 0;height:auto;letter-spacing:0}
.odo-c{display:block;height:1.1em;overflow:hidden}
.odo-strip{display:block;transition:transform 1s var(--spring)}
.odo-strip span{display:block;height:1.1em}

/* summary + quick actions */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.stat{padding:16px;text-align:left;display:block;width:100%;min-height:112px}
.stat-label{font-size:13px;color:var(--mut);font-weight:500;display:flex;align-items:center;justify-content:space-between}
.stat-num{font-size:28px;font-weight:600;letter-spacing:-.035em;margin-top:12px}
.stat-sub{font-size:12px;color:var(--faint);margin-top:8px}
#cashCard{cursor:pointer}
#cashCard.editing{border-color:rgba(255,255,255,.6)}
.cash-in{width:100%;background:transparent;border:0;outline:0;color:#fff;font-size:28px;font-weight:600;letter-spacing:-.035em;padding:0;height:1.1em;line-height:1.1}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.qa{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:14px;padding:14px;min-height:98px;text-align:left;position:relative}
.qa svg{width:22px;height:22px;color:#E4E4E7}
.qa span{font-size:13px;font-weight:500;line-height:1.25}
.dot{position:absolute;top:13px;right:13px;width:8px;height:8px;border-radius:50%;background:var(--want);box-shadow:0 0 0 3px rgba(232,194,122,.2)}
.dot[hidden]{display:none}

/* quest card */
.quest{display:block;width:100%;text-align:left;padding:16px;margin-top:10px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#17171A 0%,#0A0A0B 70%)}
.quest::after{content:'';position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.09),transparent 65%);pointer-events:none}
.quest-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:relative;z-index:1}
.quest-title{font-size:16px;font-weight:600;letter-spacing:-.02em}
.quest-sub{font-size:13px;color:var(--mut);margin-top:3px}
.xp{font-size:12px;font-weight:600;color:#fff;background:rgba(255,255,255,.1);border-radius:7px;padding:4px 8px;flex:none;display:inline-block}
.bar{height:6px;border-radius:6px;background:#222226;margin-top:14px;overflow:hidden;position:relative;z-index:1}
.bar>span{display:block;height:100%;border-radius:6px;background:#fff;width:0;transition:width .9s var(--spring)}
.quest-art{position:absolute;right:14px;bottom:14px;z-index:1}

/* rows */
.list{overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;text-align:left;transition:background-color .2s}
.row:active{background:rgba(255,255,255,.03)}
.row+.row{border-top:1px solid var(--line)}
.ic{width:44px;height:44px;border-radius:14px;background:#111113;border:1px solid var(--line);display:grid;place-items:center;color:#D4D4D8;flex:none}
.ic svg{width:19px;height:19px}
.ic.big{width:64px;height:64px;border-radius:20px}
.r-main{flex:1;min-width:0}
.r-title{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-sub{font-size:12.5px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-end{text-align:right;flex:none}
.r-amt{font-size:15px;font-weight:600;letter-spacing:-.01em}
.r-amt.pos{color:var(--pos)}
.tag{display:inline-block;margin-top:5px;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:5px}
.tag.need{background:rgba(255,255,255,.1);color:#E4E4E7}
.tag.want{background:#EDEDEF;color:#0A0A0B}
.tag.inc{background:rgba(110,219,170,.13);color:var(--pos)}
.tag.neu{background:rgba(255,255,255,.07);color:#B8B8C2}
.empty{padding:28px 20px;text-align:center;color:var(--mut);font-size:14px;line-height:1.5}
.empty b{display:block;color:var(--txt);font-size:15px;margin-bottom:4px;font-weight:600}
.day-h{font-size:13px;color:var(--mut);font-weight:500;margin:18px 4px 8px}

/* search + chips */
.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;background:#0E0E10;border:1px solid var(--line);border-radius:14px}
.search:focus-within{border-color:rgba(255,255,255,.6)}
.search svg{width:18px;height:18px;color:var(--mut);flex:none}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;font-size:16px}
.search input::placeholder,.field input::placeholder{color:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.x{flex-wrap:nowrap;overflow-x:auto;margin:0 -18px;padding:0 18px;scrollbar-width:none}
.chips.x::-webkit-scrollbar{display:none}
.chip{height:36px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#0E0E10;color:#C9C9D1;font-size:14px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none;transition:transform .3s var(--spring),background-color .2s,border-color .2s}
.chip:active{transform:scale(.96)}
.chip.on{border-color:rgba(255,255,255,.75);background:rgba(255,255,255,.12);color:#fff}
.chip svg{width:14px;height:14px}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin:16px 4px 0}

/* nav */
.nav{position:absolute;left:0;right:0;bottom:0;z-index:20;height:calc(76px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center;background:rgba(0,0,0,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:100%;color:var(--faint);transition:color .2s}
.nav-item svg{width:24px;height:24px;transition:transform .4s var(--spring)}
.nav-item::after{content:'';width:4px;height:4px;border-radius:50%;background:#fff;opacity:0;transform:scale(.4);transition:opacity .3s,transform .4s var(--spring)}
.nav-item.on{color:#fff}
.nav-item.on svg{fill:rgba(255,255,255,.16);transform:translateY(-1px)}
.nav-item.on::after{opacity:1;transform:none}
.nav-plus{justify-self:center;width:58px;height:58px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;transform:translateY(-14px);
  box-shadow:0 0 0 6px #000,0 0 0 7px var(--line2),0 12px 26px -6px rgba(0,0,0,.9);transition:transform .4s var(--spring)}
.nav-plus:active{transform:translateY(-12px) scale(.93)}
.nav-plus svg{width:26px;height:26px;stroke-width:2.2}

/* toast + fx */
.toast{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:50%;z-index:120;transform:translate(-50%,-160%);display:flex;align-items:center;gap:8px;
  padding:10px 16px 10px 12px;border-radius:99px;background:#141416;border:1px solid var(--line2);font-size:13.5px;font-weight:500;white-space:nowrap;
  box-shadow:0 12px 30px -8px rgba(0,0,0,.9);transition:transform .6s var(--spring);pointer-events:none;max-width:92%}
.toast.show{transform:translate(-50%,0)}
.toast svg{width:16px;height:16px;color:#fff;flex:none}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:130}

/* layers */
.layer{position:absolute;inset:0;z-index:50;pointer-events:none;visibility:hidden}
.layer.open{visibility:visible;pointer-events:auto}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.7);opacity:0;transition:opacity .4s var(--spring);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.layer.in .scrim{opacity:1}
.panel{position:absolute;background:#08080A;border:1px solid var(--line2)}
.layer.bottom .panel{left:0;right:0;bottom:0;max-height:94%;display:flex;flex-direction:column;border-radius:28px 28px 0 0;border-bottom:0;
  transform:translateY(102%);transition:transform .55s var(--spring);box-shadow:0 -20px 60px -20px rgba(0,0,0,.9)}
.layer.bottom.in .panel{transform:none}
.layer.center .panel{left:18px;right:18px;top:50%;border-radius:24px;max-height:88%;overflow-y:auto;padding:20px;
  transform:translateY(-46%) scale(.96);opacity:0;transition:transform .5s var(--spring),opacity .25s;scrollbar-width:none}
.layer.center.in .panel{transform:translateY(-50%) scale(1);opacity:1}
.grab{height:26px;display:grid;place-items:center;cursor:grab;touch-action:none;flex:none}
.grab::after{content:'';width:38px;height:4px;border-radius:4px;background:rgba(255,255,255,.18)}
.sheet-head{display:flex;align-items:center;gap:10px;padding:0 16px 10px;flex:none}
.sheet-title{flex:1;font-size:18px;font-weight:600;letter-spacing:-.02em;padding-left:2px}
.sheet-scroll{overflow-y:auto;padding:4px 18px 22px;flex:1;scrollbar-width:none}
.sheet-scroll::-webkit-scrollbar{display:none}
.sheet-foot{padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#08080A;flex:none}
.cta{width:100%;height:54px;border-radius:16px;background:#fff;color:#000;font-weight:600;font-size:16px;letter-spacing:-.01em;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .35s var(--spring),opacity .2s}
.cta:active{transform:scale(.98)}
.cta svg{width:18px;height:18px}
.cta.ghost{background:#111113;color:#fff;border:1px solid var(--line)}
.err{min-height:20px;color:var(--neg);font-size:13px;margin-bottom:6px;padding-left:2px}
.shake{animation:shake .38s var(--spring)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}

/* add sheet */
.seg{display:flex;flex:1;padding:3px;gap:2px;background:#101012;border:1px solid var(--line);border-radius:14px}
.seg button{flex:1;height:34px;border-radius:11px;font-size:13px;font-weight:500;color:var(--mut);transition:background-color .25s,color .25s,transform .3s var(--spring)}
.seg button:active{transform:scale(.97)}
.seg button.on{background:#232327;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.seg-nw button.on.need{background:rgba(255,255,255,.16);color:#fff}
.seg-nw button.on.want{background:#EDEDEF;color:#000}
.amt-wrap{display:flex;align-items:flex-start;justify-content:center;padding:14px 0 6px}
.rupee{font-size:30px;color:var(--mut);margin:12px 6px 0 0;font-weight:400}
.amt-in{background:transparent;border:0;outline:0;color:#fff;font-size:64px;font-weight:500;letter-spacing:-.045em;padding:0;width:3ch;line-height:1.1;caret-color:#fff}
.amt-in::placeholder{color:var(--faint)}
.pills{display:flex;justify-content:center;gap:8px;padding-bottom:4px}
.pill{height:34px;padding:0 15px;border-radius:99px;border:1px solid var(--line);background:#101012;color:#D4D4D8;font-size:13.5px;font-weight:500;transition:transform .3s var(--spring),background-color .2s}
.pill:active{transform:scale(.93);background:#1C1C20}
.pill.ghost{color:var(--mut);background:transparent}
.lbl{font-size:13px;color:var(--mut);font-weight:500;margin:20px 2px 9px}
.field{display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;border-radius:14px;background:#0E0E10;border:1px solid var(--line);margin-top:10px;transition:border-color .2s}
.field:focus-within{border-color:rgba(255,255,255,.6)}
.field svg{width:18px;height:18px;color:var(--mut);flex:none}
.field input,.field select{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;font-size:16px;height:100%}
.field select{appearance:none;-webkit-appearance:none}
.field select option{background:#111;color:#fff}
.field .pre{color:var(--mut);font-size:16px}
.mini{height:32px;padding:0 12px;border-radius:9px;background:#26262B;font-size:13px;font-weight:600}
.grid-cat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{height:94px;border-radius:18px;border:1px solid var(--line);background:#0E0E10;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:7px;padding:0 4px 10px;position:relative;
  font-size:12.5px;font-weight:500;color:#B8B8C2;transition:transform .35s var(--spring),background-color .2s,border-color .2s,color .2s;text-align:center}
.tile:active{transform:scale(.95)}
.tile.on{border-color:rgba(255,255,255,.8);background:linear-gradient(180deg,#1B1B1F,#101012);color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.12) inset}
.tile.dashed{border-style:dashed;background:transparent;justify-content:center}
.tile.dashed svg{width:22px;height:22px}
.nw{position:absolute;top:7px;left:50%;transform:translateX(-50%);display:flex;gap:1px;padding:2px;border-radius:99px;background:#000;border:1px solid var(--line2)}
.nw i{font-style:normal;font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:99px;color:var(--mut)}
.nw i.on{background:#fff;color:#000}
.split-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;padding:12px 14px;border-radius:14px;background:#0E0E10;border:1px solid var(--line)}
.split-row .t{font-size:14.5px;font-weight:500}
.split-row .s{font-size:12.5px;color:var(--mut);margin-top:2px}
.emo-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.emo-pick{width:42px;height:42px;border-radius:12px;background:#0E0E10;border:1px solid var(--line);font-size:22px;display:grid;place-items:center}
.emo-pick.on{border-color:#fff;background:rgba(255,255,255,.12)}

/* misc blocks */
.kv{display:flex;justify-content:space-between;gap:12px;padding:13px 2px;border-top:1px solid var(--line);font-size:14.5px}
.kv span{color:var(--mut)}
.kv b{font-weight:500;text-align:right}
.d-top{display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 0 18px}
.d-amt{font-size:40px;font-weight:600;letter-spacing:-.04em}
.d-label{font-size:15px;color:var(--mut)}
.danger{width:100%;height:50px;border-radius:14px;border:1px solid rgba(240,132,127,.35);color:var(--neg);font-weight:600;font-size:15px;margin-top:16px;transition:background-color .2s,transform .3s var(--spring)}
.danger:active{transform:scale(.98)}
.danger.arm{background:rgba(240,132,127,.14)}
.btn2{height:46px;padding:0 16px;border-radius:13px;background:#101012;border:1px solid var(--line);font-size:14.5px;font-weight:500;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn2 svg{width:17px;height:17px}
.acct{display:flex;align-items:center;gap:12px;padding:14px}
.acct+.acct{border-top:1px solid var(--line)}
.acct-name{font-size:15px;font-weight:500}
.acct-sub{font-size:12.5px;color:var(--mut);margin-top:3px}
.acct-sub button{color:#fff;font-weight:500}
.bal-in{width:116px;text-align:right;background:#0E0E10;border:1px solid var(--line);border-radius:11px;height:40px;padding:0 10px;color:#fff;font-size:15px;font-weight:600;outline:0}
.bal-in:focus{border-color:rgba(255,255,255,.6)}
.badge{font-size:11.5px;font-weight:500;padding:2px 7px;border-radius:5px;background:rgba(255,255,255,.08);color:#B8B8C2;margin-left:8px}
.mini-input{flex:1;min-width:0;height:44px;padding:0 12px;background:#0E0E10;border:1px solid var(--line);border-radius:12px;color:#fff;font-size:16px;outline:0}
.mini-input:focus{border-color:rgba(255,255,255,.6)}
.mini-input::placeholder{color:var(--faint)}
.emi-btn{height:34px;padding:0 12px;border-radius:10px;background:#fff;color:#000;font-size:13px;font-weight:600;margin-top:6px}
.emi-btn[disabled]{background:#1E1E22;color:var(--faint)}
.tiny-x{width:30px;height:30px;display:grid;place-items:center;color:var(--faint)}
.tiny-x svg{width:15px;height:15px}

/* game */
.lvl{display:flex;align-items:center;gap:14px;padding:16px}
.lvl-n{width:54px;height:54px;border-radius:16px;background:#fff;color:#000;display:grid;place-items:center;font-size:22px;font-weight:700;letter-spacing:-.03em;flex:none}
.q-title{font-size:19px;font-weight:600;letter-spacing:-.025em;line-height:1.3;margin:6px 0 14px}
.opt{display:block;width:100%;text-align:left;padding:14px;border-radius:14px;border:1px solid var(--line);background:#0E0E10;font-size:15px;line-height:1.35;margin-top:8px;transition:border-color .25s,background-color .25s,transform .3s var(--spring)}
.opt:active{transform:scale(.985)}
.opt.ok{border-color:rgba(110,219,170,.7);background:rgba(110,219,170,.1)}
.opt.bad{border-color:rgba(240,132,127,.7);background:rgba(240,132,127,.1)}
.opt[disabled]{cursor:default}
.explain{margin-top:14px;font-size:14px;line-height:1.5;color:#C4C4CC}
.qrow{display:flex;align-items:center;gap:10px;font-size:14px;padding:7px 0;color:var(--mut)}
.qrow .chk{width:20px;height:20px;border-radius:7px;border:1px solid var(--line2);display:grid;place-items:center;flex:none}
.qrow.done{color:var(--txt)}
.qrow.done .chk{background:#fff;border-color:#fff}
.qrow .chk svg{width:13px;height:13px;color:#000}
.g-top{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:10px}
.tbar{height:4px;border-radius:4px;background:#1E1E22;overflow:hidden}
.tbar span{display:block;height:100%;width:100%;background:#fff;border-radius:4px}
.cat-tag{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.09);color:#D4D4DA}
.res-big{font-size:64px;font-weight:600;letter-spacing:-.05em;text-align:center;margin-top:8px}

/* analytics */
.big-num{font-size:40px;font-weight:600;letter-spacing:-.04em}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.kpi{padding:14px}
.kpi span{font-size:12.5px;color:var(--mut)}
.kpi b{display:block;font-size:21px;font-weight:600;letter-spacing:-.03em;margin-top:6px}
.ratio{display:flex;height:14px;border-radius:7px;overflow:hidden;background:#1E1E22;gap:3px;margin-top:14px}
.ratio span{display:block;height:100%;width:0;transition:width 1s var(--spring)}
.r-need{background:#6C6C74;border-radius:7px 3px 3px 7px}
.r-want{background:#fff;border-radius:3px 7px 7px 3px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.lg{font-size:13px;color:var(--mut)}
.lg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.lg b{display:block;font-size:17px;color:var(--txt);margin-top:4px;font-weight:600;letter-spacing:-.02em}
.lg small{font-size:12.5px;color:var(--mut);font-weight:400;margin-left:6px}
.bars{display:flex;align-items:flex-end;gap:4px;height:100px;margin-top:14px}
.bars div{flex:1;border-radius:4px;background:#2A2A2F;height:3px;transition:height .9s var(--spring)}
.bars div.hi{background:#fff}
.bars.pair div{background:#fff}
.bars.pair div.b2{background:#4A4A52}
.bars-lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);margin-top:8px}
.bars-lbl.even span{flex:1;text-align:center}
.cat-row{display:block;width:100%;text-align:left;padding:13px 14px}
.cat-row+.cat-row{border-top:1px solid var(--line)}
.cat-top{display:flex;align-items:center;gap:12px}
.cat-bar{height:4px;border-radius:4px;background:#1E1E22;margin-top:11px;overflow:hidden}
.cat-bar span{display:block;height:100%;width:0;background:#fff;border-radius:4px;transition:width 1s var(--spring)}
.pad{padding:16px}
.budget-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--mut)}
.budget-top b{font-size:22px;color:var(--txt);letter-spacing:-.03em;font-weight:600}

/* profile */
.pcard{padding:18px;display:flex;gap:16px;align-items:center}
.pname{font-size:20px;font-weight:600;letter-spacing:-.03em}
.psub{font-size:13px;color:var(--mut);margin-top:3px}
.handles{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.handle{font-size:12px;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.08);color:#D4D4DA;display:inline-flex;align-items:center;gap:5px}
.handle svg{width:12px;height:12px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.tilestat{padding:14px}
.tilestat b{display:block;font-size:24px;font-weight:600;letter-spacing:-.03em}
.tilestat span{font-size:12.5px;color:var(--mut)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;width:100%;text-align:left}
.srow+.srow{border-top:1px solid var(--line)}
button.srow{transition:background-color .2s}
button.srow:active{background:rgba(255,255,255,.03)}
.srow .t{font-size:15px;font-weight:500}
.srow .s{font-size:12.5px;color:var(--mut);margin-top:2px}
.srow .ic{width:38px;height:38px;border-radius:11px}
.srow .chev{width:18px;height:18px;color:var(--faint);flex:none}
.settle{height:34px;padding:0 14px;border-radius:10px;background:#1A1A1E;border:1px solid var(--line);font-size:13px;font-weight:600}
.settle.arm{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.6)}
.policy h3{font-size:15px;margin:18px 0 6px;font-weight:600}
.policy p,.policy li{font-size:14px;line-height:1.6;color:#C4C4CC;margin:0 0 8px}
.policy ul{padding-left:18px;margin:0}

/* splash */
#splash{position:absolute;inset:0;z-index:200;background:#000;display:grid;place-items:center;transition:opacity .8s ease,visibility 0s .8s}
#splash.out{opacity:0;visibility:hidden;pointer-events:none}
.sp-glow{position:absolute;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.11),transparent 62%);opacity:0;animation:glowin 2.6s ease .1s forwards}
@keyframes glowin{0%{opacity:0;transform:scale(.6)}60%{opacity:1}100%{opacity:.8;transform:scale(1)}}
.sp-wrap{position:relative;width:min(300px,78%);text-align:center}
.sp-logo{width:100%;overflow:visible;display:block;animation:logoglow 1.8s ease 2s forwards}
@keyframes logoglow{0%{filter:drop-shadow(0 0 0 rgba(255,255,255,0))}45%{filter:drop-shadow(0 0 16px rgba(255,255,255,.6))}100%{filter:drop-shadow(0 0 7px rgba(255,255,255,.2))}}
.sp-logo path,.sp-logo circle{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.05s cubic-bezier(.65,0,.35,1) forwards;animation-delay:calc(.3s + var(--i)*.12s)}
@keyframes draw{to{stroke-dashoffset:0}}
.sp-line{height:1px;width:0;margin:24px auto 0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);animation:spline 1.2s var(--spring) 2.5s forwards}
@keyframes spline{to{width:100%}}
.sp-tag{margin-top:16px;font-size:11px;font-weight:500;text-transform:uppercase;color:var(--mut);opacity:0;animation:tagin 1.5s var(--spring) 2.7s forwards}
@keyframes tagin{from{opacity:0;letter-spacing:1.1em}to{opacity:1;letter-spacing:.45em}}

/* onboarding + lock */
#onb,#lock{position:absolute;inset:0;z-index:90;background:#000;display:flex;flex-direction:column;visibility:hidden;opacity:0;transition:opacity .5s var(--spring),visibility 0s .5s}
#lock{z-index:95;align-items:center;justify-content:center;padding:24px}
#onb.open,#lock.open{visibility:visible;opacity:1;transition-delay:0s}
.onb-top{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 14px) 18px 0;flex:none}
.onb-prog{flex:1;display:flex;gap:5px}
.onb-prog i{flex:1;height:3px;border-radius:3px;background:#1E1E22;overflow:hidden;position:relative}
.onb-prog i::after{content:'';position:absolute;inset:0;background:#fff;transform:scaleX(0);transform-origin:left;transition:transform .6s var(--spring)}
.onb-prog i.on::after{transform:none}
.onb-body{flex:1;overflow-y:auto;padding:22px 20px 20px;scrollbar-width:none;animation:slidein .6s var(--spring)}
.onb-body::-webkit-scrollbar{display:none}
@keyframes slidein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.onb-h{font-size:30px;font-weight:600;letter-spacing:-.04em;line-height:1.12}
.onb-p{font-size:15px;color:var(--mut);line-height:1.5;margin:10px 0 6px}
.onb-foot{padding:12px 20px calc(16px + env(safe-area-inset-bottom));flex:none}
.av-row{display:flex;align-items:center;gap:16px;margin:18px 0 6px}
.pin-t{font-size:22px;font-weight:600;letter-spacing:-.03em;text-align:center}
.pin-s{font-size:14px;color:var(--mut);text-align:center;margin-top:8px;min-height:20px}
.pin-dots{display:flex;gap:14px;justify-content:center;margin:26px 0 28px}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line2);transition:background-color .2s,transform .3s var(--spring)}
.pin-dots i.on{background:#fff;border-color:#fff;transform:scale(1.1)}
.pin-grid{display:grid;grid-template-columns:repeat(3,72px);gap:14px 22px;justify-content:center}
.pin-grid button{width:72px;height:72px;border-radius:50%;background:#0E0E10;border:1px solid var(--line);font-size:26px;font-weight:500;display:grid;place-items:center;transition:transform .2s var(--spring),background-color .2s}
.pin-grid button:active{transform:scale(.92);background:#1C1C20}
.pin-grid svg{width:24px;height:24px}
.pin-wrap{width:100%}
.forgot{display:block;margin:22px auto 0;color:var(--mut)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;transition-delay:0s!important;animation-delay:0s!important}
}
</style>
</head>
<body>
<div class="stage">
<div class="phone" id="phone">

  <!-- HOME -->
  <section class="screen active" data-screen="home" id="s-home">

        <div class="brand" id="brand" aria-label="Montera"></div>

      <button class="card quest press" id="questBtn">

            <div class="quest-title">Daily Money Quests</div>

        <span class="quest-art" id="questArt"></span>
      </button>

      <div class="sec-head"><h2>Recent transactions</h2><button class="link" id="seeAll">See all</button></div>
      <div class="card list" id="recentList"></div>
    </div>
  </section>

  <!-- TRANSACTIONS -->
  <section class="screen" data-screen="tx" id="s-tx">
    <div class="scroll">
      <h1 class="page-title">Transactions</h1>
      <label class="search">
        <i data-lucide="search"></i>
        <input id="q" type="search" placeholder="Search merchant, category or person" autocomplete="off">
        <button id="qClear" class="icon-btn sm" hidden aria-label="Clear search"><i data-lucide="x"></i></button>
      </label>
      <div class="chips x" id="txChips" style="margin-top:12px"></div>
      <div class="meta" id="txMeta"></div>
      <div id="txList"></div>
    </div>
  </section>

  <!-- ANALYTICS -->
  <section class="screen" data-screen="an" id="s-an">
    <div class="scroll">
      <h1 class="page-title">Analytics</h1>
      <div class="chips x" id="anChips"></div>
      <div id="anBody"></div>
    </div>
  </section>

  <!-- PROFILE -->
  <section class="screen" data-screen="me" id="s-me">
    <div class="scroll">
      <h1 class="page-title">Profile</h1>
      <div id="meBody"></div>
    </div>
  </section>

  <!-- NAV -->
  <nav class="nav" aria-label="Main">
    <button class="nav-item on" data-go="home" aria-label="Home"><i data-lucide="house"></i></button>
    <button class="nav-item" data-go="tx" aria-label="Transactions"><i data-lucide="archive"></i></button>

    <button class="nav-item" data-go="me" aria-label="Profile"><i data-lucide="user-round"></i></button>

  <div class="layer" id="layer"></div>
  <div id="onb"></div>
  <div id="lock"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div id="splash" aria-label="Montera">
    <div class="sp-glow"></div>

      <svg id="spSvg" class="sp-logo" viewBox="0 0 388 52" role="img" aria-label="Montera"></svg>
      <div class="sp-line"></div>
      <div class="sp-tag">Know your money</div>
    </div>
  </div>
</div>

function saveAdd(btn) {
  const a = add, amt = parseFloat(a.amount);

  if (needP && !person) return failAdd('Add a name so this can be tracked.', '#personIn');

    tx = { id: uid(), type: 'income', label: label || a.inc, cat: a.inc, amount: amt, pay: a.pay, ts: now, fx: mv(a.pay, 1) };
  } else {

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function openQuest() {
  ensureDay();
  let tm = null, gcat = 'Mixed', G = null;
  const clear = () => { clearInterval(tm); tm = null; };
  openLayer(`${sheetHead('Daily Money Quests')}<div class="sheet-scroll" id="gBody"></div>`, { onClose: clear, onMount: p => {
    const body = () => $('#gBody', p);
    const hub = () => {
      clear(); ensureDay();
      const lv = lvlOf(state.xp), into = (state.xp % 150) / 150 * 100, pl = state.played;
      const q = [['logged', 'Log a transaction'], ['quiz', 'Finish a quiz round'], ['viewed', 'Open Analytics']]
        .map(([k, l]) => `<div class="qrow ${state.quests[k] ? 'done' : ''}"><span class="chk">${state.quests[k] ? '<i data-lucide="check"></i>' : ''}</span>${l}</div>`).join('');
      body().innerHTML = `
        <div class="card lvl"><div class="lvl-n">${lv}</div><div style="flex:1"><div style="font-weight:600;font-size:16px">Level ${lv}</div><div class="mut" style="font-size:13px;margin-top:2px">${150 - (state.xp % 150)} XP to Level ${lv + 1}</div><div class="bar" style="margin-top:10px"><span data-w="${into}"></span></div></div></div>
        <div class="card pad" style="margin-top:10px">${q}</div>
        <div class="lbl" style="margin-top:22px">Pick a topic</div>
        <div class="chips">${['Mixed', 'Finance', 'Economics', 'Management'].map(c => `<button class="chip ${gcat === c ? 'on' : ''}" data-gcat="${c}">${c}</button>`).join('')}</div>
        <div class="mut" style="font-size:13px;margin:14px 2px 0">5 random questions, 20 seconds each. Correct answers earn 10 XP, +5 for a quick one, +10 for a perfect round.</div>
        <button class="cta" id="gStart" style="margin-top:16px">Start round</button>
        <div class="kpis"><div class="card kpi"><span>Rounds played</span><b>${pl.rounds}</b></div><div class="card kpi"><span>Accuracy</span><b>${pl.answered ? Math.round(pl.correct / pl.answered * 100) + '%' : '\u2013'}</b></div></div>`;
      icons(); requestAnimationFrame(() => requestAnimationFrame(() => $$('[data-w]', body()).forEach(e => e.style.width = e.dataset.w + '%')));
    };
    const start = () => {
      let pool = QB.map((q, i) => i).filter(i => gcat === 'Mixed' || QB[i][0] === gcat);
      let fresh = pool.filter(i => !state.seen.includes(i)); if (fresh.length < 5) { state.seen = state.seen.filter(i => !pool.includes(i)); fresh = pool; }
      const picks = shuffle(fresh).slice(0, 5);
      G = { qs: picks.map(i => { const q = QB[i]; return { i, c: q[0], q: q[1], e: q[4], opts: shuffle(q[2].map((t, j) => ({ t, ok: j === q[3] }))) }; }), n: 0, score: 0, pts: 0, answered: false };
      question();
    };
    const question = () => {
      const q = G.qs[G.n]; G.answered = false;
      body().innerHTML = `<div class="g-top"><span class="cat-tag">${q.c}</span><span>Question ${G.n + 1} of ${G.qs.length}</span></div><div class="tbar"><span id="tFill"></span></div>
        <div class="q-title">${esc(q.q)}</div><div id="opts">${q.opts.map((o, i) => `<button class="opt" data-o="${i}">${esc(o.t)}</button>`).join('')}</div><div id="exp"></div>`;
      const end = Date.now() + 20000; G.t0 = Date.now();
      clear(); tm = setInterval(() => { const left = end - Date.now(); const f = $('#tFill', p); if (f) f.style.width = Math.max(0, left / 20000 * 100) + '%'; if (left <= 0) answer(-1); }, 100);
    };
    const answer = idx => {
      if (G.answered) return; G.answered = true; clear();
      const q = G.qs[G.n], ok = idx >= 0 && q.opts[idx].ok, quick = Date.now() - G.t0 < 8000;
      $$('.opt', p).forEach((x, j) => { x.disabled = true; if (q.opts[j].ok) x.classList.add('ok'); else if (j === idx) x.classList.add('bad'); });
      if (ok) { G.score++; G.pts += 10 + (quick ? 5 : 0); }
      state.played.answered++; if (ok) state.played.correct++; if (!state.seen.includes(q.i)) state.seen.push(q.i); state.seen = state.seen.slice(-40);
      if (ok) chime(); else tick();
      const last = G.n === G.qs.length - 1;
      $('#exp', p).innerHTML = `<div class="explain"><b style="color:${ok ? 'var(--pos)' : 'var(--neg)'}">${ok ? (quick ? 'Correct and quick. +15 XP' : 'Correct. +10 XP') : idx < 0 ? 'Time is up.' : 'Not quite.'}</b><br>${esc(q.e)}</div><button class="cta" id="gNext" style="margin-top:16px">${last ? 'See results' : 'Next question'}</button>`;
      save();
    };
    const result = () => {
      const bonus = G.score === G.qs.length ? 10 : 0, gain = G.pts + bonus, before = lvlOf(state.xp);
      state.xp += gain; state.played.rounds++; ensureDay(); if (!state.quests.quiz) { state.quests.quiz = true; state.xp += 10; } save();
      const after = lvlOf(state.xp);
      body().innerHTML = `<div style="text-align:center;padding-top:8px">${catVis('Quest', 72)}<div class="res-big">${G.score}/${G.qs.length}</div>
        <div style="font-size:17px;font-weight:600;margin-top:6px">+${gain} XP${bonus ? ' (perfect round)' : ''}</div>
        <div class="mut" style="font-size:14px;margin-top:6px">${after > before ? `Level up! You reached Level ${after}.` : `${150 - (state.xp % 150)} XP to Level ${after + 1}`}</div></div>
        <button class="cta" id="gAgain" style="margin-top:22px">Play again</button><button class="cta ghost" data-close style="margin-top:10px">Done</button>`;
      icons(); chime(); refreshActive(); if (after > before) { const r = body().getBoundingClientRect(), pr = phone.getBoundingClientRect(); burst(r.left + r.width / 2 - pr.left, r.top + 120 - pr.top); }
    };
    p.addEventListener('click', e => {
      const c = e.target.closest('[data-gcat]'); if (c) { tick(); gcat = c.dataset.gcat; $$('[data-gcat]', p).forEach(b => b.classList.toggle('on', b.dataset.gcat === gcat)); return; }
      if (e.target.closest('#gStart') || e.target.closest('#gAgain')) { tick(); start(); return; }
      const o = e.target.closest('[data-o]'); if (o && G && !G.answered) { answer(+o.dataset.o); return; }
      if (e.target.closest('#gNext')) { tick(); if (G.n === G.qs.length - 1) result(); else { G.n++; question(); } }
    });
    hub();
  } });
}

/* ---------- validation + profile forms ---------- */
const reEmail = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/, rePhone = /^\+?[\d\s-]{7,16}$/, reHandle = /^[A-Za-z0-9._]{1,30}$/;
const cleanHandle = v => (v || '').trim().replace(/^@+/, '');
function checkProfile(D, part) {
  if (part !== 'contact' && part !== 'money' && !D.name.trim()) return 'Tell us what to call you.';
  if ((part === 'work' || part === 'all') && D.income !== '' && !(parseFloat(D.income) >= 0)) return 'Enter your income as a number, or leave it empty.';
  if (part === 'money') {
    for (const k of ['cash', 'bank', 'credit']) if (D[k] !== '' && D[k] != null && isNaN(parseFloat(D[k]))) return 'Enter amounts as numbers, or leave them empty.';
  }
  if (part === 'contact' || part === 'all') {
    if (D.email && !reEmail.test(D.email.trim())) return 'That email does not look right.';
    if (D.phone && !rePhone.test(D.phone.trim())) return 'Enter a phone number with 7 to 16 digits.';
    if (D.insta && !reHandle.test(cleanHandle(D.insta))) return 'Instagram usernames use letters, numbers, dots and underscores.';
    if (D.snap && !reHandle.test(cleanHandle(D.snap))) return 'Snapchat usernames use letters, numbers, dots and underscores.';
  }
  return '';
}

/* ---------- PIN + lock ---------- */
async function hashPin(p) {
  const s = 'montera.pin.v1' + p;
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  catch (e) { let h = 5381; for (const ch of s) h = ((h << 5) + h + ch.charCodeAt(0)) | 0; return 'x' + h; }
}
function pinPad(host, o) {
  let v = '';
  host.innerHTML = `<div class="pin-wrap"><div class="pin-t">${o.title}</div><div class="pin-s" id="pS">${o.sub || ''}</div><div class="pin-dots" id="pDots"><i></i><i></i><i></i><i></i></div>
    <div class="pin-grid">${[1,2,3,4,5,6,7,8,9,'',0,'del'].map(k => k === '' ? '<span></span>' : `<button data-k="${k}" aria-label="${k === 'del' ? 'Delete' : k}">${k === 'del' ? '<i data-lucide="delete"></i>' : k}</button>`).join('')}</div>${o.extra || ''}</div>`;
  icons();
  const dots = () => $$('#pDots i', host).forEach((d, i) => d.classList.toggle('on', i < v.length));
  const api = {
    reset(msg) { v = ''; dots(); $('#pS', host).textContent = msg || ''; const d = $('#pDots', host); d.classList.remove('shake'); void d.offsetWidth; if (msg) d.classList.add('shake'); },
    title(t, s) { $('.pin-t', host).textContent = t; $('#pS', host).textContent = s || ''; }
  };
  host.onclick = e => {
    const x = e.target.closest('[data-extra]'); if (x && o.onExtra) { o.onExtra(x, api); return; }
    const b = e.target.closest('[data-k]'); if (!b) return; tick(); const k = b.dataset.k;
    if (k === 'del') v = v.slice(0, -1); else if (v.length < 4) v += k;
    dots(); if (v.length === 4) { const val = v; setTimeout(() => o.onDone(val, api), 140); }
  };
  return api;
}
function unlock() {
  return new Promise(res => {
    const L = $('#lock'); L.classList.add('open');
    pinPad(L, { title: 'Enter PIN', sub: 'Montera is locked', extra: '<button class="link forgot" data-extra>Forgot PIN?</button>',
      onDone: async (x, a) => { if (await hashPin(x) === state.prefs.pin) { L.classList.remove('open'); L.innerHTML = ''; res(); } else a.reset('Wrong PIN. Try again.'); },
      onExtra: (btn) => { if (!btn.dataset.arm) { btn.dataset.arm = '1'; btn.textContent = 'Tap again to erase all data and unlock'; setTimeout(() => { if (btn.isConnected) { delete btn.dataset.arm; btn.textContent = 'Forgot PIN?'; } }, 3500); return; } try { localStorage.removeItem(KEY); } catch (e) {} location.reload(); } });
  });
}
function openPin() {
  const has = !!state.prefs.pin;
  openLayer(`${sheetHead('App lock')}<div class="sheet-scroll"><div id="pinHost" style="padding-top:12px"></div></div>`, { onMount: p => {
    const host = $('#pinHost', p);
    const setup = () => {
      let first = '';
      const api = pinPad(host, { title: 'Create a PIN', sub: 'Choose 4 digits', onDone: async (x, a) => {
        if (!first) { first = x; a.reset(''); a.title('Confirm your PIN', 'Enter the same 4 digits again'); return; }
        if (x !== first) { first = ''; a.reset('PINs did not match. Start again.'); a.title('Create a PIN', 'PINs did not match. Start again.'); return; }
        state.prefs.pin = await hashPin(x); save(); closeLayer(); refreshActive(); toast('App lock is on', 'lock');
      } });
    };
    if (!has) { setup(); return; }
    pinPad(host, { title: 'Enter current PIN', sub: '', onDone: async (x, a) => {
      if (await hashPin(x) !== state.prefs.pin) { a.reset('Wrong PIN. Try again.'); return; }
      host.innerHTML = `<div class="pin-t" style="margin-bottom:18px">App lock is on</div><button class="cta" id="chg">Change PIN</button><button class="cta ghost" id="off" style="margin-top:10px">Turn off app lock</button>`;
      host.onclick = e => { if (e.target.closest('#chg')) { host.onclick = null; setup(); } if (e.target.closest('#off')) { state.prefs.pin = ''; save(); closeLayer(); refreshActive(); toast('App lock is off', 'lock-open'); } };
    } });
  } });
}

/* ---------- export / import ---------- */
async function download(name, text, mime) {
  try {
    const file = new File([text], name, { type: mime });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return true; }
  } catch (e) { if (e && e.name === 'AbortError') return true; }
  try { const blob = new Blob([text], { type: mime }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); return true; } catch (e) { return false; }
}
const csvCell = v => { v = String(v == null ? '' : v); if (/^[=+\-@\t\r]/.test(v)) v = "'" + v; return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
function exportCsv() {
  const rows = [['Date', 'Type', 'Category', 'Note', 'Amount', 'Payment', 'Person', 'Need/Want']].concat(state.txs.map(t => [new Date(t.ts).toISOString().slice(0, 16).replace('T', ' '), t.type, t.cat, t.label, t.amount, t.pay, t.person || '', t.tag || '']));
  download('montera-transactions.csv', rows.map(r => r.map(csvCell).join(',')).join('\n'), 'text/csv').then(ok => toast(ok ? 'CSV ready' : 'Could not export', 'file-spreadsheet'));
}
function importBackup(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const s = JSON.parse(fr.result);
      if (!s || s.v !== 2 || !Array.isArray(s.txs) || !Array.isArray(s.accounts)) throw new Error('bad');
      const b = blank(); state = Object.assign(b, s, { profile: Object.assign(b.profile, s.profile), prefs: Object.assign(b.prefs, s.prefs), played: Object.assign(b.played, s.played), streak: Object.assign(b.streak, s.streak), quests: Object.assign(b.quests, s.quests) });
      state.prefs.onboarded = true; save(); ensureDay(); refreshActive(); toast('Backup restored', 'upload');
    } catch (e) { toast('That is not a Montera backup', 'x'); }
  };
  fr.readAsText(file);
}

/* ---------- onboarding ---------- */
function onboarding() {
  return new Promise(resolve => {
    const root = $('#onb'); root.classList.add('open');
    const D = { name: '', avatar: { t: 'emoji', v: AVATARS[0] }, country: '', currency: state.prefs.currency, occupation: '', income: '', email: '', phone: '', insta: '', snap: '', cash: '', bank: '', bankName: '', credit: '' };

    const view = () => {
      const t = [
        () => `<div class="onb-h">Let\u2019s set up<br>your Montera.</div><p class="onb-p">Everything stays on this device. Start with the basics.</p>${avatarPicker(D.avatar)}${fld('fName', 'user-round', 'What should we call you?', D.name, 'maxlength="24" autocomplete="given-name"')}`,
        () => `<div class="onb-h">Where are you<br>from?</div><p class="onb-p">Pick your country and the currency you track money in.</p>${countrySel(D.country)}<div class="lbl">Currency</div>${curChips(D.currency)}`,

        () => `<div class="onb-h">Stay<br>connected.</div><p class="onb-p">All optional. Add whatever you like.</p>${fld('fEmail', 'mail', 'Email', D.email, 'type="email" inputmode="email" maxlength="60"')}${fld('fPhone', 'phone', 'Phone number', D.phone, 'type="tel" inputmode="tel" maxlength="18"')}${fld('fInsta', 'instagram', 'Instagram username', D.insta, 'maxlength="31" autocapitalize="none"')}${fld('fSnap', 'ghost', 'Snapchat username', D.snap, 'maxlength="31" autocapitalize="none"')}`,
        () => { const s = esc((CURS.find(c => c[0] === D.currency) || CURS[0])[1]); return `<div class="onb-h">Where is your<br>money right now?</div><p class="onb-p">Start from your real numbers. Leave anything at 0 and change it later.</p>
          <div class="lbl">Cash in hand</div><label class="field" style="margin-top:0"><span class="pre">${s}</span><input id="fCash" inputmode="decimal" placeholder="0" value="${esc(D.cash)}"></label>
          <div class="lbl">Bank balance</div><label class="field" style="margin-top:0"><span class="pre">${s}</span><input id="fBank" inputmode="decimal" placeholder="0" value="${esc(D.bank)}"></label>
          ${fld('fBankName', 'landmark', 'Bank or account name (optional)', D.bankName, 'maxlength="24"')}
          <div class="lbl">Credit card dues</div><label class="field" style="margin-top:0"><span class="pre">${s}</span><input id="fCredit" inputmode="decimal" placeholder="0" value="${esc(D.credit)}"></label>`; }
      ][step]();
      root.innerHTML = `<div class="onb-top"><button class="icon-btn" id="oBack" aria-label="Back" ${step ? '' : 'style="visibility:hidden"'}><i data-lucide="arrow-left"></i></button>
        <div class="onb-prog">${Array.from({ length: N }, (_, i) => `<i class="${i <= step ? 'on' : ''}"></i>`).join('')}</div>
        <button class="link" id="oSkip" ${step === 0 ? 'style="visibility:hidden"' : ''}>Skip</button></div>
        <div class="onb-body" id="oBody">${t}</div>
        <div class="onb-foot"><div class="err" id="oErr" role="alert"></div><button class="cta" id="oNext">${step === N - 1 ? 'Start tracking' : 'Continue'}</button></div>`;
      icons();
      const b = $('#oBody', root);
      if (step === 0) setTimeout(() => { const n = $('#fName', root); n && n.focus({ preventScroll: true }); }, 500);
      if (step === 1) $('#fCountry', root).addEventListener('change', e => { D.country = e.target.value; const c = C2C[D.country]; if (c) { D.currency = c; $$('[data-cur]', root).forEach(x => x.classList.toggle('on', x.dataset.cur === c)); } });
      if (step === 0) bindAvatar(b, () => D.avatar, v => { D.avatar = v; }, m => { $('#oErr', root).textContent = m; });
    };
    const finish = () => {
      const p = state.profile;
      Object.assign(p, { name: D.name.trim(), avatar: D.avatar, country: D.country, occupation: D.occupation, income: parseFloat(D.income) || 0, email: D.email.trim(), phone: D.phone.trim(), insta: cleanHandle(D.insta), snap: cleanHandle(D.snap) });
      state.prefs.currency = D.currency; state.cash = parseFloat(D.cash) || 0; state.creditDue = parseFloat(D.credit) || 0;
      const bb = parseFloat(D.bank) || 0; if (bb !== 0 || D.bankName.trim()) state.accounts.push({ id: uid(), name: D.bankName.trim() || 'Bank account', bal: bb });
      state.prefs.onboarded = true; save(); chime();
      root.classList.remove('open'); setTimeout(() => { root.innerHTML = ''; }, 600); resolve();
    };
    const next = skip => {
      readInputs(root, D);
      if (!skip) {
        const part = ['name', 'country', 'work', 'contact', 'money'][step]; const er = checkProfile(D, part);
        if (er) { const e = $('#oErr', root); e.textContent = er; const bx = $('#oNext', root); bx.classList.remove('shake'); void bx.offsetWidth; bx.classList.add('shake'); return; }
      } else {
        if (step === 3) { D.email = D.phone = D.insta = D.snap = ''; }
        if (step === 2) { D.income = ''; D.occupation = ''; }
        if (step === 4) { D.cash = D.bank = D.bankName = D.credit = ''; }
      }
      tick(); if (step === N - 1) finish(); else { step++; view(); }
    };
    root.addEventListener('click', e => {
      if (e.target.closest('#oNext')) return next(false);
      if (e.target.closest('#oSkip')) return next(true);
      if (e.target.closest('#oBack')) { readInputs(root, D); tick(); step = Math.max(0, step - 1); view(); return; }
      const c = e.target.closest('[data-cur]'); if (c) { tick(); D.currency = c.dataset.cur; $$('[data-cur]', root).forEach(x => x.classList.toggle('on', x.dataset.cur === D.currency)); return; }
      const o = e.target.closest('[data-occ]'); if (o) { tick(); D.occupation = D.occupation === o.dataset.occ ? '' : o.dataset.occ; $$('[data-occ]', root).forEach(b => b.classList.toggle('on', b.dataset.occ === D.occupation)); }
    });
    root.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); next(false); } });
    view();
  });
}

      <g fill="none" stroke="url(#wipe)" stroke-width="7" stroke-linejoin="round">${logoInner(true)}</g>`;

    if (reduceMotion) { svg.querySelector('g').setAttribute('stroke', '#fff'); setTimeout(out, 500); return; }
    setTimeout(() => { try { $('#aw1').beginElement(); $('#aw2').beginElement(); } catch (e) { svg.querySelector('g').setAttribute('stroke', '#fff'); } }, 1500);
    const t0 = Date.now();
    sp.addEventListener('click', () => { if (Date.now() - t0 > 700) out(); });
    setTimeout(out, 4000);
  });
}

  });
  $('#s-an').addEventListener('click', e => {
    const p = e.target.closest('[data-per]'); if (p) { tick(); anPer = p.dataset.per; renderAn(); return; }
    if (e.target.closest('[data-act="budget"]')) { tick(); openBudget(); return; }
    const c = e.target.closest('[data-cat-go]'); if (c) { tick(); F.q = ''; F.type = 'expense'; F.cat = c.dataset.catGo; go('tx'); }
  });
  $('#s-me').addEventListener('click', e => {
    const pref = e.target.closest('[data-pref]');
    if (pref) { if (pref.dataset.pref === 'sound') { state.prefs.muted = !state.prefs.muted; if (!state.prefs.muted) tick(); } else { tick(); state.prefs.private = !state.prefs.private; } save(); updateHome(); renderMe(); return; }
    const st = e.target.closest('[data-settle]');
    if (st) {
      if (!st.classList.contains('arm')) { st.classList.add('arm'); st.textContent = 'Confirm'; setTimeout(() => { if (st.isConnected) { st.classList.remove('arm'); st.textContent = 'Settle'; } }, 3000); return; }
      const f = ledger().find(x => x.name === st.dataset.settle); if (!f) return;
      const amt = Math.abs(f.bal), inn = f.bal > 0;
      commitTx({ id: uid(), type: 'settle', label: inn ? `${f.name} paid you back` : `Paid back ${f.name}`, cat: 'Settle', amount: amt, pay: 'UPI', person: f.name, ts: Date.now(), fx: { bank: inn ? amt : -amt, friend: -f.bal } });
      chime(); refreshActive(); toast(`Settled with ${f.name}`); return;
    }
    const a = e.target.closest('[data-act]'); if (!a) return; tick();
    const act = a.dataset.act;
    if (act === 'edit') openEditProfile();
    else if (act === 'currency') openCurrency();
    else if (act === 'budget') openBudget();
    else if (act === 'pin') openPin();
    else if (act === 'privacy') openPrivacy();
    else if (act === 'csv') exportCsv();
    else if (act === 'json') download('montera-backup.json', JSON.stringify(state, null, 2), 'application/json').then(ok => toast(ok ? 'Backup ready' : 'Could not export', 'download'));
    else if (act === 'import') { const f = $('#impFile'); if (f) f.click(); }
    else if (act === 'reset') {
      const t = $('.t', a);
      if (!a.dataset.arm) { a.dataset.arm = '1'; t.textContent = 'Tap again to erase everything'; t.style.color = 'var(--neg)'; setTimeout(() => { if (a.isConnected) { delete a.dataset.arm; t.textContent = 'Erase all data'; t.style.color = ''; } }, 3000); return; }
      try { localStorage.removeItem(KEY); } catch (err) {} location.reload();
    }
  });
  $('#s-me').addEventListener('change', e => { if (e.target.id === 'impFile' && e.target.files[0]) { importBackup(e.target.files[0]); e.target.value = ''; } });
  window.addEventListener('resize', fitFx);
}

/* ---------- boot ---------- */
let booted = false, hiddenAt = 0, locking = false;
document.addEventListener('visibilitychange', async () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (booted && state.prefs.pin && hiddenAt && Date.now() - hiddenAt > 30000 && !locking) { locking = true; await unlock(); locking = false; }
});
async function boot() {
  ensureDay(); save(); wire(); fitFx(); updateHome(); icons();
  await splash();
  if (state.prefs.pin) await unlock();
  if (!state.prefs.onboarded) await onboarding();
  booted = true; updateHome(); icons();
  if (state.profile.name) toast(`Welcome, ${state.profile.name.split(' ')[0]}`, 'sparkles');
}
boot();
})();
</script>
</body>
